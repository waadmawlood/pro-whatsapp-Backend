            maximum: 100
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: السجل
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/AuditLog'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions:
    get:
      tags: [Permissions]
      summary: قائمة الصلاحيات
      operationId: listPermissions
      responses:
        '200':
          description: كل الصلاحيات والقيم الافتراضية للموظف
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PermissionCatalog'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /broadcasting/auth:
    post:
      tags: [Realtime]
      summary: مصادقة قناة البث
      description: |
        يُستخدم من Laravel Echo. المسار الفعلي هو `POST /api/broadcasting/auth` (بدون `/v1`).
        القنوات: `private-company.{id}` و `private-user.{id}` و `private-conversation.{id}`.

        **أحداث WhatsApp Web على قناة الشركة:**
        - `whatsapp.connection` — تحديث QR أو حالة الاتصال (الحقل `account` في الحمولة).
      operationId: broadcastingAuth
      servers:
        - url: /api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [socket_id, channel_name]
              properties:
                socket_id:
                  type: string
                channel_name:
                  type: string
                  example: private-company.1
      responses:
        '200':
          description: مفتاح تفويض القناة
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum Token
    bridgeSecret:
      type: apiKey
      in: header
      name: X-Bridge-Secret
      description: السر المشترك بين Laravel وجسر WhatsApp (`WHATSAPP_BRIDGE_SECRET`)

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    Query:
      name: q
      in: query
      description: بحث نصي
      schema:
        type: string
    UserId:
      name: user
      in: path
      required: true
      schema:
        type: integer
    CustomerId:
      name: customer
      in: path
      required: true
      schema:
        type: integer
    ConversationId:
      name: conversation
      in: path
      required: true
      schema:
        type: integer
    TagId:
      name: tag
      in: path
      required: true
      schema:
        type: integer
    WhatsAppAccountId:
      name: whatsappAccount
      in: path
      required: true
      schema:
        type: integer
    TokenId:
      name: token
      in: path
      required: true
      schema:
        type: integer

  responses:
    MessageOk:
      description: نجاح
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuccessEnvelope'
    Unauthenticated:
      description: غير مصادق
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Unauthenticated.
    Unauthorized:
      description: بيانات الدخول غير صحيحة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Invalid credentials.
    Forbidden:
      description: لا توجد صلاحية أو الحساب معطّل
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Forbidden.
    NotFound:
      description: غير موجود أو خارج نطاق الشركة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: Resource not found.
    ValidationError:
      description: خطأ تحقق
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorEnvelope'
    TooManyRequests:
      description: تجاوز حد الطلبات

  schemas:
    SuccessEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data: {}

    CreatedEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Created
        data: {}

    PaginatedEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: OK
        data:
          type: array
          items: {}
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        last_page:
          type: integer
          example: 4
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 73

    ErrorEnvelope:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

    ValidationErrorEnvelope:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email:
              - The email field is required.

    CustomerStatus:
      type: string
      enum: [new, active, waiting, completed, blocked]

    ConversationStatus:
      type: string
      enum: [open, closed]

    MessageType:
      type: string
      enum: [text, image, video, document, audio, sticker, location, contacts, unknown]

    MessageDirection:
      type: string
      enum: [inbound, outbound]

    MessageStatus:
      type: string
      enum: [sending, sent, delivered, read, failed]

    WhatsAppAccountStatus:
      type: string
      enum: [pending, connected, disconnected, error]

    WhatsAppConnectionType:
      type: string
      enum: [web, cloud]
      default: web
      description: |
        `web` — WhatsApp Web عبر جسر Baileys (افتراضي).
        `cloud` — Meta WhatsApp Cloud API.

    BridgeSessionStatus:
      type: object
      properties:
        status:
          type: string
          enum: [disconnected, connecting, qr, connected, logged_out, error]
        qr:
          type: string
          nullable: true
          deprecated: true
          description: استخدم qr_data_url
        qr_data_url:
          type: string
          nullable: true
          description: data URL جاهز لعرض QR في الفرونت
        qr_available:
          type: boolean
        phone_number:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    WhatsAppBridgeState:
      type: object
      properties:
        status:
          type: string
          enum: [disconnected, connecting, qr, connected, logged_out, error]
        qr_available:
          type: boolean
        qr_data_url:
          type: string
          nullable: true
          description: ضعه مباشرة في src لعنصر img
          example: data:image/png;base64,iVBORw0KGgo...
        phone_number:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        source:
          type: string
          enum: [database, bridge]
        is_connected:
          type: boolean
        poll_after_ms:
          type: integer
          nullable: true
          description: فترة الانتظار قبل إعادة الطلب (مثلاً 3000)
        account:
          $ref: '#/components/schemas/WhatsAppAccount'

    BridgeQrResponse:
      type: object
      properties:
        qr:
          type: string
          nullable: true
          description: data URL لرمز QR
        source:
          type: string
          enum: [database, bridge]
          description: مصدر QR (قاعدة البيانات أو الجسر مباشرة)
        status:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true

    BridgeConnectResponse:
      type: object
      properties:
        account:
          $ref: '#/components/schemas/WhatsAppAccount'
        bridge:
          $ref: '#/components/schemas/BridgeSessionStatus'

    BridgeConnectionWebhook:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [connecting, qr, connected, disconnected, logged_out, error]
        qr:
          type: string
          nullable: true
        phone_number:
          type: string
          nullable: true
        message:
          type: string
          nullable: true

    BridgeMessageWebhook:
      type: object
      required: [from, type]
      properties:
        whatsapp_message_id:
          type: string
        from:
          type: string
          description: رقم المرسل بصيغة دولية
        push_name:
          type: string
          nullable: true
        type:
          type: string
          enum: [text, image, video, document, audio, sticker, unknown]
        body:
          type: string
          nullable: true
        timestamp:
          type: integer
        media:
          type: object
          nullable: true
          properties:
            mimetype:
              type: string
            filename:
              type: string
            file_base64:
              type: string

    BridgeStatusWebhook:
      type: object
      required: [whatsapp_message_id, status]
      properties:
        whatsapp_message_id:
          type: string
        status:
          type: string
          enum: [sent, delivered, read, failed, server_ack, delivery_ack, read_ack]
        error:
          type: string
          nullable: true

    PermissionName:
      type: string
      enum:
        - customers.view
        - customers.create
        - customers.update
        - customers.delete
        - conversations.view
        - conversations.view_all
        - conversations.assign
        - conversations.close
        - conversations.delete
        - messages.view
        - messages.send
        - notes.create
        - tags.view
        - tags.manage
        - users.view
        - users.manage
        - whatsapp.manage
        - reports.view
        - audit.view

    Locale:
      type: string
      enum: [ar, en]

    Company:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        locale:
          $ref: '#/components/schemas/Locale'
        timezone:
          type: string
          example: Asia/Riyadh
        is_active:
          type: boolean

    User:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        avatar:
          type: string
          nullable: true
        locale:
          $ref: '#/components/schemas/Locale'
        is_active:
          type: boolean
        is_online:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        roles:
          type: array
          items:
            type: string
            enum: [admin, employee]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionName'
        company:
          $ref: '#/components/schemas/Company'
        created_at:
          type: string
          format: date-time

    Tag:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        color:
          type: string
          example: '#2563EB'

    Customer:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        display_name:
          type: string
        phone:
          type: string
        whatsapp_number:
          type: string
        avatar:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/CustomerStatus'
        assigned_user_id:
          type: integer
          nullable: true
        whatsapp_account_id:
          type: integer
          nullable: true
        last_contacted_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        assigned_user:
          $ref: '#/components/schemas/User'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'

    Conversation:
      type: object
      properties:
        id:
          type: integer
        link_id:
          type: string
          nullable: true
          description: معرف خارجي اختياري لربط المحادثة بنظام آخر
        status:
          $ref: '#/components/schemas/ConversationStatus'
        assigned_user_id:
          type: integer
          nullable: true
        whatsapp_account_id:
          type: integer
        unread_count:
          type: integer
        last_message_preview:
          type: string
          nullable: true
        last_message_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/Customer'
        assigned_user:
          $ref: '#/components/schemas/User'
        whatsapp_account:
          $ref: '#/components/schemas/WhatsAppAccount'

    UpdateConversationRequest:
      type: object
      properties:
        link_id:
          type: string
          nullable: true
          maxLength: 191
          description: معرف خارجي فريد داخل الشركة، أو null لإزالته

    MediaFile:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/MessageType'
        filename:
          type: string
          nullable: true
        mime_type:
          type: string
          nullable: true
        size:
          type: integer
        url:
          type: string
          nullable: true
        caption:
          type: string
          nullable: true

    Message:
      type: object
      properties:
        id:
          type: integer
        conversation_id:
          type: integer
        user_id:
          type: integer
          nullable: true
        direction:
          $ref: '#/components/schemas/MessageDirection'
        type:
          $ref: '#/components/schemas/MessageType'
        body:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/MessageStatus'
        error_message:
          type: string
          nullable: true
        sent_at:
          type: string
          format: date-time
          nullable: true
        delivered_at:
          type: string
          format: date-time
          nullable: true
        read_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'
        media:
          type: array
          items:
            $ref: '#/components/schemas/MediaFile'

    Note:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
        customer_id:
          type: integer
        conversation_id:
          type: integer
          nullable: true
        user:
          $ref: '#/components/schemas/User'
        created_at:
          type: string
          format: date-time

    WhatsAppAccount:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        connection_type:
          $ref: '#/components/schemas/WhatsAppConnectionType'
        phone_number:
          type: string
          description: للحسابات web يُملأ تلقائياً بعد مسح QR
        phone_number_id:
          type: string
          nullable: true
          description: Cloud API فقط
        waba_id:
          type: string
          nullable: true
          description: Cloud API فقط
        status:
          $ref: '#/components/schemas/WhatsAppAccountStatus'
        is_default:
          type: boolean
        webhook_verify_token:
          type: string
          description: Cloud API فقط
        has_access_token:
          type: boolean
        webhook_url:
          type: string
          format: uri
          description: Cloud API فقط
          example: http://localhost:8000/api/v1/webhooks/whatsapp/1
        bridge_qr_available:
          type: boolean
          description: Web فقط — هل يوجد QR جاهز
        bridge_connected_at:
          type: string
          format: date-time
          nullable: true
          description: Web فقط — وقت آخر اتصال
        last_webhook_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: office-1
        last_used_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        is_current:
          type: boolean

    AuditLog:
      type: object
      properties:
        id:
          type: integer
        action:
          type: string
          example: conversation.assigned
        description:
          type: string
          nullable: true
        entity_type:
          type: string
          nullable: true
        entity_id:
          type: integer
          nullable: true
        old_values:
          type: object
          nullable: true
        new_values:
          type: object
          nullable: true
        ip_address:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/User'

    DashboardStats:
      type: object
      properties:
        customers:
          type: object
          properties:
            total:
              type: integer
            new:
              type: integer
            new_today:
              type: integer
        conversations:
          type: object
          properties:
            total:
              type: integer
            open:
              type: integer
            closed:
              type: integer
            unassigned:
              type: integer
        messages:
          type: object
          properties:
            today:
              type: integer
            this_month:
              type: integer
        employees:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              is_online:
                type: boolean
              conversations:
                type: integer
              open_conversations:
                type: integer
              messages_sent:
                type: integer
              customers:
                type: integer

    SearchResults:
      type: object
      properties:
        customers:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        conversations:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/Message'

    PermissionCatalog:
      type: object
      properties:
        all:
          type: array
          items:
            $ref: '#/components/schemas/PermissionName'
        employee_defaults:
          type: array
          items:
            $ref: '#/components/schemas/PermissionName'

    NotificationListResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          allOf:
            - $ref: '#/components/schemas/PaginationMeta'
            - type: object
              properties:
                unread_count:
                  type: integer

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
        device_name:
          type: string
          maxLength: 80
          description: اسم الجهاز لتمييز الجلسات

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessEnvelope'
        - type: object
          properties:
            data:
              type: object
              properties:
                token:
                  type: string
                token_type:
                  type: string
                  example: Bearer
                user:
                  $ref: '#/components/schemas/User'

    UpdateProfileRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          nullable: true
          maxLength: 30
        locale:
          $ref: '#/components/schemas/Locale'
        password:
          type: string
          minLength: 8
        password_confirmation:
          type: string

    StoreUserRequest:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
        locale:
          $ref: '#/components/schemas/Locale'
        is_active:
          type: boolean
          default: true
        role:
          type: string
          enum: [admin, employee]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionName'

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        password:
          type: string
          minLength: 8
        locale:
          $ref: '#/components/schemas/Locale'
        is_active:
          type: boolean
        role:
          type: string
          enum: [admin, employee]
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionName'

    StoreCustomerRequest:
      type: object
      required: [phone]
      properties:
        name:
          type: string
          nullable: true
        phone:
          type: string
        whatsapp_number:
          type: string
          nullable: true
        assigned_user_id:
          type: integer
          nullable: true
        whatsapp_account_id:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/CustomerStatus'
        tag_ids:
          type: array
          items:
            type: integer

    UpdateCustomerRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        phone:
          type: string
        whatsapp_number:
          type: string
        assigned_user_id:
          type: integer
          nullable: true
        whatsapp_account_id:
          type: integer
          nullable: true
        status:
          $ref: '#/components/schemas/CustomerStatus'
        tag_ids:
          type: array
          items:
            type: integer

    StoreNoteRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          maxLength: 5000
        conversation_id:
          type: integer
          nullable: true

    StoreMessageJsonRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MessageType'
        body:
          type: string
          maxLength: 4096
        caption:
          type: string
          maxLength: 1024

    StoreMessageMultipartRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/MessageType'
        body:
          type: string
        caption:
          type: string
        file:
          type: string
          format: binary
          description: حتى 16MB. صور، فيديو، مستندات، صوت.

    StoreTagRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 60
        color:
          type: string
          maxLength: 16
          example: '#2563EB'

    StoreWhatsAppAccountRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        connection_type:
          $ref: '#/components/schemas/WhatsAppConnectionType'
        phone_number:

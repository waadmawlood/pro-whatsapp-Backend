openapi: 3.0.3
info:
  title: Pro WhatsApp API
  version: 1.0.0
  description: |
    REST API لنظام إدارة عملاء ومحادثات WhatsApp.

    ## طرق ربط WhatsApp
    - **web** (افتراضي): جلسة WhatsApp Web عبر جسر Node.js (Baileys) — رقم واحد وعدة موظفين.
    - **cloud**: Meta WhatsApp Cloud API الرسمي.

    ## جسر WhatsApp Web
    شغّل خدمة `whatsapp-bridge` واضبط:
    ```
    WHATSAPP_BRIDGE_URL=http://127.0.0.1:3001
    WHATSAPP_BRIDGE_SECRET=shared-secret
    ```

    ## المصادقة
    بعد `POST /auth/login` أرسل التوكن في كل طلب:
    ```
    Authorization: Bearer {token}
    ```

    ## اللغة
    ```
    Accept-Language: ar
    Accept-Language: en
    ```

    ## حدود الطلبات
    | المسار | الحد |
    |--------|------|
    | عام | 120 طلب / دقيقة |
    | تسجيل الدخول | 5 طلبات / دقيقة |
    | Webhooks | 180 طلب / دقيقة |

    ## حسابات التجربة
    | الدور | البريد | كلمة المرور |
    |--------|--------|-------------|
    | Admin | admin@example.com | password |
    | Employee | ahmed@example.com | password |
  contact:
    name: Pro WhatsApp
  license:
    name: MIT

servers:
  - url: /api/v1
    description: API v1

tags:
  - name: Auth
    description: تسجيل الدخول والجلسات والملف الشخصي
  - name: Users
    description: إدارة الموظفين (Admin)
  - name: Customers
    description: إدارة العملاء والملاحظات والوسوم
  - name: Conversations
    description: صندوق الوارد وتعيين وإغلاق المحادثات
  - name: Messages
    description: إرسال واستقبال الرسائل داخل محادثة
  - name: Tags
    description: وسوم العملاء
  - name: WhatsApp
    description: ربط أرقام WhatsApp (Web عبر الجسر أو Cloud API)
  - name: Webhooks
    description: استقبال أحداث Meta Cloud API وجسر WhatsApp Web
  - name: Dashboard
    description: إحصائيات الأدمن
  - name: Search
    description: بحث شامل
  - name: Notifications
    description: إشعارات داخل النظام
  - name: Audit
    description: سجل العمليات
  - name: Permissions
    description: قائمة الصلاحيات المتاحة
  - name: Realtime
    description: مصادقة قنوات البث

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: تسجيل الدخول
      description: يُرجع توكن مستقل لكل جهاز. يمكن تسجيل الدخول من عدة حواسيب في نفس الوقت.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: admin@example.com
              password: password
              device_name: office-1
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [Auth]
      summary: تسجيل الخروج من الجهاز الحالي
      operationId: logout
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: تسجيل الخروج من كل الأجهزة
      operationId: logoutAll
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/me:
    get:
      tags: [Auth]
      summary: المستخدم الحالي
      operationId: me
      responses:
        '200':
          description: بيانات المستخدم مع الأدوار والصلاحيات والشركة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/profile:
    put:
      tags: [Auth]
      summary: تحديث الملف الشخصي
      operationId: updateProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: الملف بعد التحديث
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/sessions:
    get:
      tags: [Auth]
      summary: جلسات الأجهزة المتصلة
      operationId: listSessions
      responses:
        '200':
          description: قائمة التوكنات
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /auth/sessions/{token}:
    delete:
      tags: [Auth]
      summary: إلغاء جلسة جهاز
      operationId: revokeSession
      parameters:
        - $ref: '#/components/parameters/TokenId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /users:
    get:
      tags: [Users]
      summary: قائمة الموظفين
      description: يتطلب `users.view` أو `users.manage`.
      operationId: listUsers
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, employee]
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: قائمة صفحات
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: إضافة موظف
      description: يتطلب `users.manage`. للموظف يمكن تمرير `permissions` إضافية.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreUserRequest'
            example:
              name: علي
              email: ali@example.com
              password: password
              role: employee
              locale: ar
              permissions:
                - customers.view
                - messages.send
      responses:
        '201':
          description: تم الإنشاء
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{user}:
    get:
      tags: [Users]
      summary: عرض موظف
      operationId: getUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: موظف
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: تحديث موظف
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: بعد التحديث
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Users]
      summary: حذف موظف
      description: لا يمكن حذف الحساب الحالي. يحذف التوكنات أيضاً.
      operationId: deleteUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers:
    get:
      tags: [Customers]
      summary: قائمة العملاء
      description: يتطلب `customers.view`.
      operationId: listCustomers
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CustomerStatus'
        - name: assigned_user_id
          in: query
          schema:
            type: integer
        - name: tag_id
          in: query
          schema:
            type: integer
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: قائمة صفحات
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Customers]
      summary: إضافة عميل
      description: يتطلب `customers.create`. رقم الهاتف يُطبَّع تلقائياً (أرقام فقط).
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreCustomerRequest'
            example:
              name: سارة علي
              phone: '+966 55 123 4567'
              status: new
              tag_ids: [1, 2]
      responses:
        '201':
          description: تم الإنشاء
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /customers/{customer}:
    get:
      tags: [Customers]
      summary: عرض عميل
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: عميل
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Customers]
      summary: تحديث عميل
      description: يتطلب `customers.update`.
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomerRequest'
      responses:
        '200':
          description: بعد التحديث
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Customers]
      summary: حذف عميل
      description: يتطلب `customers.delete`.
      operationId: deleteCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /customers/{customer}/notes:
    get:
      tags: [Customers]
      summary: ملاحظات العميل
      operationId: listCustomerNotes
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: قائمة الملاحظات
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Customers]
      summary: إضافة ملاحظة
      description: يتطلب `notes.create`.
      operationId: createCustomerNote
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreNoteRequest'
            example:
              body: العميل طلب معاودة الاتصال غداً
              conversation_id: 12
      responses:
        '201':
          description: تم الإنشاء
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Note'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /customers/{customer}/tags:
    post:
      tags: [Customers]
      summary: مزامنة وسوم العميل
      description: يستبدل كل الوسوم بالقائمة المرسلة. يتطلب `customers.update`.
      operationId: syncCustomerTags
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_ids]
              properties:
                tag_ids:
                  type: array
                  items:
                    type: integer
            example:
              tag_ids: [1, 3]
      responses:
        '200':
          description: العميل بعد المزامنة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Customer'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /conversations:
    get:
      tags: [Conversations]
      summary: صندوق الوارد
      description: |
        الموظف يرى محادثاته فقط ما لم يملك `conversations.view_all`.
      operationId: listConversations
      parameters:
        - $ref: '#/components/parameters/Query'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ConversationStatus'
        - name: unassigned
          in: query
          description: "قيمة true للمحادثات غير المخصصة"
          schema:
            type: boolean
        - name: assigned_user_id
          in: query
          schema:
            type: integer
        - name: customer_id
          in: query
          schema:
            type: integer
        - name: link_id
          in: query
          description: تصفية حسب المعرف الخارجي للمحادثة
          schema:
            type: string
        - $ref: '#/components/parameters/PerPage'
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: قائمة المحادثات
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /conversations/{conversation}:
    get:
      tags: [Conversations]
      summary: فتح محادثة
      description: بشكل افتراضي يتم تصفير العداد غير المقروء (`mark_read=true`).
      operationId: getConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - name: mark_read
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: المحادثة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Conversations]
      summary: تحديث محادثة
      description: |
        تحديث بيانات المحادثة مثل `link_id`. يتطلب صلاحية عرض المحادثة.
        أرسل `link_id: null` لإزالة المعرف الخارجي.
      operationId: updateConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
            example:
              link_id: ticket-1001
      responses:
        '200':
          description: المحادثة بعد التحديث
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Conversation'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Conversations]
      summary: حذف محادثة
      description: يتطلب `conversations.delete`.
      operationId: deleteConversation
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /conversations/{conversation}/messages:
    get:
      tags: [Messages]
      summary: رسائل المحادثة
      description: الأحدث أولاً. يدعم البحث داخل النص عبر `q`.
      operationId: listMessages
      parameters:
        - $ref: '#/components/parameters/ConversationId'
        - $ref: '#/components/parameters/Query'
        - name: per_page
          in: query
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 100
        - $ref: '#/components/parameters/Page'
      responses:
        '200':
          description: قائمة الرسائل
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginatedEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Messages]
      summary: إرسال رسالة
      description: |
        يتطلب `messages.send`. أرسل JSON للنص أو `multipart/form-data` للوسائط.
        الحالة الأولية `sending` ثم تُحدَّث عبر الويب هوك إلى sent / delivered / read / failed.
      operationId: sendMessage
      parameters:
        - $ref: '#/components/parameters/ConversationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreMessageJsonRequest'
            example:
              type: text
              body: مرحباً، كيف يمكنني مساعدتك؟
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StoreMessageMultipartRequest'
      responses:
        '201':
          description: تم إنشاء الرسالة وإرسالها للطابور
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /conversations/{conversation}/assign:
    post:
      tags: [Conversations]
      summary: تعيين محادثة لموظف
      description: "يتطلب conversations.assign. أرسل user_id=null لإلغاء التعيين."
      operationId: assignConversation
      parameters:

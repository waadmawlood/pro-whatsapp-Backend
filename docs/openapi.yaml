  /whatsapp-accounts:
    get:
      tags: [WhatsApp]
      summary: أرقام واتساب المرتبطة
      description: يتطلب `whatsapp.manage`.
      operationId: listWhatsAppAccounts
      responses:
        '200':
          description: القائمة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WhatsAppAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [WhatsApp]
      summary: ربط رقم واتساب
      description: |
        يتطلب `whatsapp.manage`.

        **WhatsApp Web (`connection_type: web`)** — الافتراضي: يكفي `name` فقط. بعد الإنشاء استدعِ
        `POST /whatsapp-accounts/{id}/bridge/connect` ثم اعرض QR من `/bridge/qr`.

        **Cloud API (`connection_type: cloud`)**: يتطلب `phone_number`, `phone_number_id`, `access_token`.
        بعد الإنشاء استخدم `webhook_url` و `webhook_verify_token` في Meta Developer.
      operationId: createWhatsAppAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreWhatsAppAccountRequest'
            examples:
              web:
                summary: WhatsApp Web (افتراضي)
                value:
                  name: الخط الرئيسي
                  connection_type: web
                  is_default: true
              cloud:
                summary: Meta Cloud API
                value:
                  name: الخط الرئيسي
                  connection_type: cloud
                  phone_number: '966500000000'
                  phone_number_id: '123456789012345'
                  waba_id: '987654321098765'
                  access_token: EAAB...
                  app_secret: your-app-secret
                  is_default: true
      responses:
        '201':
          description: تم الربط
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/CreatedEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WhatsAppAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /whatsapp-accounts/{whatsappAccount}:
    get:
      tags: [WhatsApp]
      summary: عرض رقم واتساب
      operationId: getWhatsAppAccount
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      responses:
        '200':
          description: الحساب
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WhatsAppAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [WhatsApp]
      summary: تحديث رقم واتساب
      operationId: updateWhatsAppAccount
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWhatsAppAccountRequest'
      responses:
        '200':
          description: بعد التحديث
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WhatsAppAccount'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [WhatsApp]
      summary: حذف رقم واتساب
      operationId: deleteWhatsAppAccount
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      responses:
        '200':
          $ref: '#/components/responses/MessageOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /whatsapp-accounts/{whatsappAccount}/bridge:
    get:
      tags: [WhatsApp]
      summary: حالة ربط WhatsApp Web (للفرونت)
      description: |
        يتطلب `whatsapp.manage` و`connection_type: web`.

        **Endpoint موحّد للفرونت** — يُرجع الحالة + QR جاهز للعرض في `<img src={qr_data_url} />`.

        - عند `status=qr` أو `connecting` استخدم `poll_after_ms` للتحديث الدوري.
        - `?refresh=true` لجلب QR مباشرة من الجسر.
      operationId: getWhatsAppBridgeState
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
        - name: refresh
          in: query
          schema:
            type: boolean
            default: false
          description: جلب QR مباشرة من الجسر بدل الكاش
      responses:
        '200':
          description: حالة الجسر مع QR
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/WhatsAppBridgeState'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: الحساب ليس من نوع web

  /whatsapp-accounts/{whatsappAccount}/bridge/status:
    get:
      tags: [WhatsApp]
      summary: حالة جلسة WhatsApp Web
      description: |
        يتطلب `whatsapp.manage` و`connection_type: web`.
        يستعلم خدمة الجسر عن حالة الاتصال الحالية.
      operationId: getWhatsAppBridgeStatus
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      responses:
        '200':
          description: حالة الجسر
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BridgeSessionStatus'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: الحساب ليس من نوع web
        '503':
          description: خدمة الجسر غير متاحة

  /whatsapp-accounts/{whatsappAccount}/bridge/qr:
    get:
      tags: [WhatsApp]
      summary: جلب رمز QR للربط
      description: |
        يتطلب `whatsapp.manage` و`connection_type: web`.
        يُرجع QR كـ data URL (`data:image/png;base64,...`) من قاعدة البيانات أو من الجسر مباشرة.
      operationId: getWhatsAppBridgeQr
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      responses:
        '200':
          description: رمز QR
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BridgeQrResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: الحساب ليس من نوع web
        '503':
          description: خدمة الجسر غير متاحة

  /whatsapp-accounts/{whatsappAccount}/bridge/connect:
    post:
      tags: [WhatsApp]
      summary: بدء جلسة WhatsApp Web
      description: |
        يتطلب `whatsapp.manage` و`connection_type: web`.
        يبدأ جلسة Baileys في الجسر. بعدها استدعِ `/bridge/qr` وامسح الرمز من تطبيق واتساب.
      operationId: connectWhatsAppBridge
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      responses:
        '200':
          description: تم بدء الجلسة
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BridgeConnectResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: الحساب ليس من نوع web
        '503':
          description: خدمة الجسر غير متاحة

  /whatsapp-accounts/{whatsappAccount}/bridge/disconnect:
    post:
      tags: [WhatsApp]
      summary: قطع جلسة WhatsApp Web
      description: |
        يتطلب `whatsapp.manage` و`connection_type: web`.
        ينهي الجلسة ويمسح بيانات المصادقة من الجسر.
      operationId: disconnectWhatsAppBridge
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      responses:
        '200':
          description: تم قطع الاتصال
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/BridgeConnectResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: الحساب ليس من نوع web
        '503':
          description: خدمة الجسر غير متاحة

  /webhooks/whatsapp/{whatsappAccount}:
    get:
      tags: [Webhooks]
      summary: تحقق اشتراك Meta
      description: يستدعيه Meta عند إعداد Callback URL. يُرجع `hub.challenge` كنص خام.
      operationId: verifyWhatsAppWebhook
      security: []
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
        - name: hub.mode
          in: query
          schema:
            type: string
            example: subscribe
        - name: hub.verify_token
          in: query
          schema:
            type: string
        - name: hub.challenge
          in: query
          schema:
            type: string
      responses:
        '200':
          description: challenge كنص
          content:
            text/plain:
              schema:
                type: string
                example: '12345'
        '403':
          description: توكن التحقق غير صحيح
    post:
      tags: [Webhooks]
      summary: استقبال أحداث واتساب
      description: |
        أحداث الرسائل الواردة وحالات التسليم. يُتحقق من `X-Hub-Signature-256` إذا تم حفظ `app_secret`.
        المعالجة تتم في Queue.
      operationId: receiveWhatsAppWebhook
      security: []
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: تم استلام الحدث
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: توقيع غير صالح

  /webhooks/whatsapp-bridge/{whatsappAccount}/connection:
    post:
      tags: [Webhooks]
      summary: حدث اتصال جسر WhatsApp Web
      description: |
        يستدعيه جسر Node.js عند تغيّر حالة الجلسة (connecting, qr, connected, disconnected, logged_out, error).
        يتطلب الهيدر `X-Bridge-Secret` المطابق لـ `WHATSAPP_BRIDGE_SECRET`.
        يُبث حدث `whatsapp.connection` على قناة الشركة.
      operationId: receiveBridgeConnectionWebhook
      security:
        - bridgeSecret: []
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeConnectionWebhook'
            examples:
              qr:
                summary: QR جاهز
                value:
                  status: qr
                  qr: data:image/png;base64,iVBORw0KGgo...
              connected:
                summary: اتصال ناجح
                value:
                  status: connected
                  phone_number: '966500000000'
      responses:
        '200':
          description: تم استلام الحدث
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: سر الجسر غير صحيح

  /webhooks/whatsapp-bridge/{whatsappAccount}/message:
    post:
      tags: [Webhooks]
      summary: رسالة واردة من جسر WhatsApp Web
      description: |
        يستدعيه جسر Node.js عند استقبال رسالة من واتساب.
        يُنشئ عميلاً ومحادثة ورسالة تلقائياً.
      operationId: receiveBridgeMessageWebhook
      security:
        - bridgeSecret: []
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeMessageWebhook'
            example:
              whatsapp_message_id: ABC123
              from: '966555000111'
              push_name: Ahmed
              type: text
              body: مرحباً
              timestamp: 1725000000
      responses:
        '200':
          description: تم استلام الرسالة
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: سر الجسر غير صحيح

  /webhooks/whatsapp-bridge/{whatsappAccount}/status:
    post:
      tags: [Webhooks]
      summary: تحديث حالة رسالة من الجسر
      description: |
        يستدعيه جسر Node.js عند تغيّر حالة إرسال رسالة (sent, delivered, read, failed).
      operationId: receiveBridgeStatusWebhook
      security:
        - bridgeSecret: []
      parameters:
        - $ref: '#/components/parameters/WhatsAppAccountId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BridgeStatusWebhook'
            example:
              whatsapp_message_id: ABC123
              status: delivered
      responses:
        '200':
          description: تم تحديث الحالة
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
        '403':
          description: سر الجسر غير صحيح

